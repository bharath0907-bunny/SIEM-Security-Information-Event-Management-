services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "cluster.name=wazuh-cluster"
      - "node.name=wazuh-indexer"
      - "network.host=0.0.0.0"
      # Demo config runs automatically — generates self-signed TLS certs + admin/admin user
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    ports:
      - "9200:9200"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    ports:
      - "1514:1514/tcp"
      - "1514:1514/udp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    volumes:
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-api:/var/ossec/api/configuration
      - ../wazuh/ossec.conf:/var/ossec/etc/ossec.conf
      - ../wazuh/rules/custom_rules.xml:/var/ossec/etc/rules/custom_rules.xml
      - ../wazuh/decoders/custom_decoders.xml:/var/ossec/etc/decoders/custom_decoders.xml
    environment:
      - WAZUH_API_PASSWORD=SecretPassword123!
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'running' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    ports:
      - "5601:5601"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - WAZUH_API_URL=https://wazuh-manager:55000
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=SecretPassword123!
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    volumes:
      - ./kibana/kibana.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    networks:
      - siem-network

# logstash service disabled (image unavailable)

  ui:
    build:
      context: ../frontend
    container_name: siem-ui
    ports:
      - "8080:8080"
    volumes:
      - ../reports:/app/reports:ro
    networks:
      - siem-network


volumes:
  wazuh-indexer-data:
  wazuh-manager-logs:
  wazuh-manager-api:

networks:
  siem-network:
    driver: bridge
